name: Expendable Workbench rerun verification
on: pull_request
permissions:
  contents: read
jobs:
  intentional-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Fail intentionally to verify failed-job rerun requests
        run: |
          echo "Expendable fixture for filipgutica/t3code PR 75. Failure is expected."
          exit 1
